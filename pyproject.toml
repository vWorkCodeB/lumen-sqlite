[project]
name = "lumen-sqlite"
version = "0.1.0"
description = "An MCP server for storing and manipulating structured data using SQLite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lumen-sqlite = "lumen_sqlite:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
